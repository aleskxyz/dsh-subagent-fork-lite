version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Ignore all @types/node major bumps so types stay on the Node 22 line
      # (matching engines ^22.19). Minor/patch 22.x updates still arrive.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
