version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep Node types on the engines floor (^22 / >=24), not Node 26+.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
