name: publish

on:
  push:
    tags: ['v*']

# Least privilege at workflow scope; elevate only on the publish job.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run verify:self-contained
      - run: node scripts/check-host-versions.mjs

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Job has contents:write for the release step; do not persist that
          # token into .git for pnpm install / lifecycle scripts.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
      # Trusted publishing needs Node >= 22.14 and npm CLI >= 11.5.1.
      # Do not set NODE_AUTH_TOKEN / NPM_TOKEN — that forces the legacy token path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${tag}"
            exit 1
          fi
      - name: Publish to npm
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-subagent-fork-lite@${version}" version >/dev/null 2>&1; then
            echo "dsh-subagent-fork-lite@${version} is already published; skipping npm publish"
          else
            # OIDC auth via Trusted Publisher; provenance is generated automatically.
            pnpm publish --no-git-checks
          fi
      - name: Verify the version is live on the registry
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            if npm view "dsh-subagent-fork-lite@${version}" version >/dev/null 2>&1; then
              echo "dsh-subagent-fork-lite@${version} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}: not visible on the registry yet; retrying"
            sleep 5
          done
          echo "::error::dsh-subagent-fork-lite@${version} is not on the registry after the publish step"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
